spring:
  application:
    name: tete-a-tete-backend
  datasource:
    url: jdbc:mysql://localhost:3306/bdd_tat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Paris
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
    show-sql: false

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: change-me-to-a-long-random-secret-key-for-production
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost,http://127.0.0.1,http://localhost:8080

logging:
  level:
    org.springframework.security: INFO
